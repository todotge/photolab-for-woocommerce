name: Build ZIP

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: composer install --no-dev
      - run: npm ci && npm run build:css
      - name: Build ZIP
        run: |
          zip -r photolab.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".looper/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "vendor/*" \
            -x "bin/*" \
            -x "stubs/*" \
            -x "docs/*" \
            -x "composer.*" \
            -x "package*" \
            -x "tailwind.config.js" \
            -x "phpstan*" \
            -x "phpunit*" \
            -x ".env.testing" \
            -x ".gitignore" \
            -x ".phpunit.cache/*" \
            -x "*.md" \
            -x "CODE_OF_CONDUCT.md" \
            -x "CONTRIBUTING.md" \
            -x "SECURITY.md" \
            -x "CHANGELOG.md" \
            -x "AGENTS.md" \
            -x "CLAUDE.md"
      - uses: actions/upload-artifact@v7
        with:
          name: photolab
          path: photolab.zip
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: photolab.zip
          generate_release_notes: true
          make_latest: true
