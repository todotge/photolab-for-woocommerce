name: Security settings

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  enforce:
    runs-on: ubuntu-latest
    environment: photolab
    steps:
      - name: Enable Dependabot vulnerability alerts
        run: |
          gh api -X PUT repos/${{ github.repository }}/vulnerability-alerts --silent
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}

      - name: Enable Dependabot automated security fixes
        run: |
          gh api -X PUT repos/${{ github.repository }}/automated-security-fixes --silent
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
