name: Feature Request
description: Propose a new feature
labels: ["type/feature", "status/needs-review"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution in detail
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin is affected?
      options:
        - upload
        - watermark
        - database
        - rest-api
        - admin-ui
        - fsm
        - cleanup
        - ci-cd
        - build
        - core
        - other
