name: Bug Report
description: Report a bug
labels: ["type/bugfix", "status/needs-review"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens? What should happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to reproduce the bug step by step
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the plugin is affected?
      options:
        - upload
        - watermark
        - database
        - rest-api
        - admin-ui
        - fsm
        - cleanup
        - ci-cd
        - build
        - core
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin version (e.g. 2.2.5)
