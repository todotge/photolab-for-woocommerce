name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels: ['type/feature']
  - title: 'Bug Fixes'
    labels: ['type/bugfix']
  - title: 'Security'
    labels: ['type/security']
  - title: 'Performance'
    labels: ['type/performance']
  - title: 'Refactoring'
    labels: ['type/refactor', 'type/maintenance']
  - title: 'Documentation'
    labels: ['type/docs']
  - title: 'Dependencies'
    labels: ['type/dependencies']
  - title: 'Tests'
    labels: ['type/testing']
change-template: '- $TITLE (#$NUMBER)'
template: |
  $CHANGES
